name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements-research.txt
          pip install -e .
      - name: Verify production/research runtime imports
        run: python -c "import lightgbm, numba, pyarrow, catboost; import sbr"
      - name: Lint maintained package and test surfaces
        run: ruff check src tests scripts
      - name: Check research ledger hygiene
        run: python research/scripts/check_research_hygiene.py
      - name: Run tests
        run: pytest -q
